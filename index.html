<!DOCTYPE html>
<html>
<head>
  <!--
    Content-Security-Policy lewat meta-tag (v1.7.0 — Rencana
    Keamanan §10, pola perbaikan DEBT 18 Nov 2026): GitHub
    Pages tidak bisa mengatur response header, jadi CSP hanya
    bisa lewat meta-tag. Kebijakan ini lintasan pertama —
    cukup longgar supaya Flutter web + Firebase + Google
    Sign-In + Supabase Storage tetap jalan ('unsafe-inline'
    untuk frame-buster di bawah, 'unsafe-eval' untuk
    Flutter), tapi tetap membatasi: koneksi hanya ke host
    Google/Firebase/Supabase (mencegah pencurian data ke host
    asing), tanpa object/embed, iframe hanya untuk Google
    Sign-In. VERIFIKASI di build live sebelum memperketat
    (mis. hapus 'unsafe-inline' bila frame-buster dipindah ke
    file .js sendiri). frame-ancestors TIDAK BISA lewat
    meta-tag (diabaikan browser) — clickjacking dicegah
    dengan frame-buster di bawah.
    HOTFIX v1.7.2 (18 Nov 2026, situs blank total sejak v1.7.0):
    Flutter web memuat CanvasKit dari CDN Google
    (www.gstatic.com/flutter-canvaskit/...) BUKAN dari folder
    canvaskit/ lokal — CSP awal tidak mengizinkannya sehingga
    mesin Flutter tidak pernah jalan (halaman putih kosong,
    tanpa splash). Karena itu script-src + connect-src WAJIB
    memuat https://www.gstatic.com; connect-src juga wajib
    memuat https://fonts.gstatic.com (font Roboto diunduh
    lewat fetch, yang diatur connect-src, bukan font-src).
    JANGAN hapus kedua host ini dari CSP.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com wss://*.googleapis.com wss://*.firebaseio.com https://accounts.google.com https://apis.google.com https://*.supabase.co wss://*.supabase.co https://www.gstatic.com https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://accounts.google.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <script>
    // Frame-busting: web BABUL HUDA tidak pernah di-frame di mana pun.
    // Bila dibuka di dalam frame (clickjacking), keluar dari frame.
    if (window.top !== window.self) { window.top.location = window.self.location; }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/babul-huda-official/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Web dayah salafy BABUL HUDA OFFICIAL — biodata Thalabah, Thawaleb, dan Guru.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BABUL HUDA OFFICIAL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BABUL HUDA OFFICIAL</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
